name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # CPU binaries are bundled. Avoid the unpatched adm-zip extraction path
  # used by ONNX Runtime's optional accelerator download installer.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  lisp-runtime:
    name: Protected Lisp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install test runtimes
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y sbcl bubblewrap python3
            # Dedicated CI runner: permit the user namespaces required by bwrap.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          else
            brew install sbcl python
          fi
      - run: npm ci
      - run: npm ci --prefix tests/fixtures/dsh-runtime
      - name: Verify Laya worker protocol and input integrity without Core ML
        run: npm run test:laya-worker
      - run: npm run verify:lisp:vendor
      - name: Test actual runtime and native DSH guard
        shell: bash
        run: |
          KIOKUKO_REQUIRE_LISP_RUNTIME=1 \
          KIOKUKO_DSH_PACKAGE_ROOT="$PWD/tests/fixtures/dsh-runtime/node_modules" \
          npm run test:lisp
      - run: npm run pack:check
      - name: Verify Skill bodies through native and packed model delivery
        run: npm run test:skill-delivery
      - name: Verify isolated core and optional module packages
        run: npm run test:modules

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Set up pnpm for DSH CLI
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Install dependencies
        run: npm ci

      - name: Install pinned DeepSeek Harness CLI
        run: |
          dsh_cli_dir="$RUNNER_TEMP/dsh-cli"
          mkdir -p "$dsh_cli_dir"
          cp tests/fixtures/dsh-runtime/package*.json "$dsh_cli_dir/"
          npm ci --prefix "$dsh_cli_dir"
          echo "$dsh_cli_dir/node_modules/.bin" >> "$GITHUB_PATH"
          # The mandatory compaction suite loads the same pinned native fixture.
          ln -s "$dsh_cli_dir/node_modules" tests/fixtures/dsh-runtime/node_modules
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache-dsh

      - name: Type-check
        run: npm run typecheck
      - name: Check deterministic Skill compilation and fixed efficiency targets
        run: npm run test:skill-prompts && npm run test:skill-efficiency

      - name: Run test suite
        run: npm test

      - name: Run semantic retrieval evaluation
        run: npm run test:evaluation

      - name: Check typed decision Skill evaluation fixtures
        run: npm run test:evaluation:decisions
      - name: Check memory reuse Choice and Noul evaluation fixtures
        run: npm run test:evaluation:memory-reuse -- --mode=all

      - name: Verify sqlite-vec package and production composition
        run: npm run test:sqlite-vec
        env:
          KIOKUKO_REQUIRE_SQLITE_VEC_SMOKE: "1"

      - name: Verify sample database baseline init and DSH resume
        run: npm run test:sampledb

      - name: Verify package contents
        run: npm run pack:check

      - name: Lint package publication metadata
        run: npm run publint

      - name: Verify reproducible prepare output
        run: npm run verify:prepare

      - name: Verify automatic Orca dependencies in an empty consumer
        run: npm run test:orca:package

      - name: Verify DeepSeek Harness composition and package lifecycle
        run: npm run test:e2e:dsh
        env:
          KIOKUKO_EXPECTED_DSH_VERSION: 0.1.5-rc.1
          KIOKUKO_REQUIRE_DSH_CLI: "1"
          KIOKUKO_DSH_EVIDENCE_PATH: ${{ runner.temp }}/kiokuko-dsh-evidence.json

      - name: Upload DSH lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiokuko-dsh-evidence-linux
          path: ${{ runner.temp }}/kiokuko-dsh-evidence.json
          if-no-files-found: ignore

      - name: Verify pinned local embedding manifest
        run: node scripts/run-local-embedding-smoke.mjs --offline

  dsh-runtime-macos:
    name: DSH runtime smoke (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Set up pnpm for DSH CLI
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Install dependencies
        run: npm ci

      - name: Install pinned DeepSeek Harness CLI
        run: |
          dsh_cli_dir="$RUNNER_TEMP/dsh-cli"
          mkdir -p "$dsh_cli_dir"
          cp tests/fixtures/dsh-runtime/package*.json "$dsh_cli_dir/"
          npm ci --prefix "$dsh_cli_dir"
          echo "$dsh_cli_dir/node_modules/.bin" >> "$GITHUB_PATH"
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache-dsh

      - name: Verify automatic Orca dependencies in an empty consumer
        run: npm run test:orca:package

      - name: Verify DeepSeek Harness Web lifecycle
        run: npm run test:e2e:dsh
        env:
          KIOKUKO_EXPECTED_DSH_VERSION: 0.1.5-rc.1
          KIOKUKO_REQUIRE_DSH_CLI: "1"
          KIOKUKO_DSH_EVIDENCE_PATH: ${{ runner.temp }}/kiokuko-dsh-evidence.json

      - name: Upload DSH lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiokuko-dsh-evidence-macos
          path: ${{ runner.temp }}/kiokuko-dsh-evidence.json
          if-no-files-found: ignore

  dsh-current-native:
    name: DSH 0.1.7 native and Web compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - run: npm ci
      - run: npm ci --prefix tests/fixtures/dsh-runtime
      - run: npm ci --prefix tests/fixtures/dsh-runtime-current
      - name: Verify current full suite
        run: npm test
        env:
          KIOKUKO_DSH_PACKAGE_ROOT: ${{ github.workspace }}/tests/fixtures/dsh-runtime-current/node_modules
          KIOKUKO_EXPECTED_DSH_VERSION: 0.1.7-rc.2
          KIOKUKO_REQUIRE_DSH_NATIVE: "1"
      - run: npm run build
      - name: Verify standard preset subagents with current DSH
        run: node scripts/run-tests.mjs tests/dsh/integration/subagent-standard-preset-native.test.ts
        env:
          KIOKUKO_DSH_PACKAGE_ROOT: ${{ github.workspace }}/tests/fixtures/dsh-runtime-current/node_modules
          KIOKUKO_EXPECTED_DSH_VERSION: 0.1.7-rc.2
          KIOKUKO_REQUIRE_DSH_NATIVE: "1"
      - name: Verify current native request and history contracts
        run: |
          node scripts/run-tests.mjs \
            tests/dsh/e2e/model-routing-loop.test.ts \
            tests/dsh/e2e/answer-review-loop.test.ts \
            tests/dsh/e2e/evolution-native.test.ts \
            tests/dsh/e2e/execution-support-loop.test.ts \
            tests/dsh/e2e/native-agent-loop.test.ts \
            tests/dsh/integration/enno-memory/native-loop.test.ts \
            tests/dsh/integration/model-handoff/native.test.ts \
            tests/dsh/integration/session-history-compatibility.test.ts \
            tests/dsh/integration/semantic-compaction/native.test.ts \
            tests/dsh/integration/semantic-compaction/observation-native.test.ts
        env:
          KIOKUKO_DSH_PACKAGE_ROOT: ${{ github.workspace }}/tests/fixtures/dsh-runtime-current/node_modules
          KIOKUKO_EXPECTED_DSH_VERSION: 0.1.7-rc.2
          KIOKUKO_REQUIRE_DSH_NATIVE: "1"
      - name: Verify current packed Web lifecycle
        run: node scripts/run-enno-dsh-e2e.mjs
        env:
          DSH_BIN: ${{ github.workspace }}/tests/fixtures/dsh-runtime-current/node_modules/.bin/dsh
          KIOKUKO_DSH_PACKAGE_ROOT: ${{ github.workspace }}/tests/fixtures/dsh-runtime-current/node_modules
          KIOKUKO_EXPECTED_DSH_VERSION: 0.1.7-rc.2
          KIOKUKO_REQUIRE_DSH_CLI: "1"
          KIOKUKO_DSH_CLI_ONLY: "1"

  semantic-platform-smoke:
    name: Semantic smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify sqlite-vec package and production composition
        run: npm run test:sqlite-vec
        env:
          KIOKUKO_REQUIRE_SQLITE_VEC_SMOKE: "1"

      - name: Verify pinned local embedding manifest
        run: node scripts/run-local-embedding-smoke.mjs --offline
