name: CI
on:
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
env:
  ONNXRUNTIME_NODE_INSTALL: skip
jobs:
  micro-judge-native:
    name: Native micro-judge (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      # Fixed CI/MSRV build input; local builds use an existing capable compiler.
      - name: Install the CI baseline Rust toolchain on this disposable runner
        shell: bash
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Build and accept the actual native binary
        shell: bash
        run: node scripts/build-verify-micro-judge.mjs "$(rustup which --toolchain 1.85.0 rustc)" --output="${{ runner.temp }}/micro-judge-${{ matrix.platform }}"
      - run: node --test scripts/micro-judge-artifacts.test.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: micro-judge-${{ matrix.platform }}
          path: ${{ runner.temp }}/micro-judge-${{ matrix.platform }}
          if-no-files-found: error
  lisp-runtime:
    needs: micro-judge-native
    name: Protected Lisp (${{ matrix.os }}, ${{ matrix.partition }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-latest
        partition: [native, distribution, skills-source, skills-packed]
    runs-on: ${{ matrix.os }}
    # Previous macOS native verification steps: 433 + 242 seconds.
    # Merge their setup/build once; keep both shards and allow measured headroom.
    timeout-minutes: ${{ matrix.partition == 'native' && 25 || 20 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install test runtimes
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y sbcl bubblewrap python3
            # Dedicated CI runner: permit the user namespaces required by bwrap.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          else
            brew install sbcl python
          fi
      - name: Download all natively accepted micro-judge targets
        uses: actions/download-artifact@v8
        with:
          pattern: micro-judge-*
          path: ${{ runner.temp }}/micro-judge-input
      - name: Assemble the multi-platform package bundle
        run: node scripts/merge-micro-judge-artifacts.mjs "${{ runner.temp }}/micro-judge-input"
      - run: npm ci
      - run: npm ci --prefix tests/fixtures/dsh-runtime
      - name: Export DSH fixture version
        run: node -e "const p=require('./tests/fixtures/dsh-runtime/package.json'); console.log('KIOKUKO_EXPECTED_DSH_VERSION='+p.dependencies['@deepseek-ai/dsh'])" >> "$GITHUB_ENV"
      - name: Run repository verification (lisp)
        run: npm run verify -- --profile lisp --partition "${{ matrix.partition }}" --output "${{ runner.temp }}/verification-lisp-runtime"
      - name: Retain verification plan, logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-ci-lisp-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/verification-lisp-runtime/**
            !${{ runner.temp }}/verification-lisp-runtime/npm-cache/**
          if-no-files-found: error
  verify-main:
    needs: micro-judge-native
    name: Main (${{ matrix.partition }})
    strategy:
      fail-fast: false
      matrix:
        partition: [unit-evaluations, integration, e2e-1, e2e-2, consumers]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env: {}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - name: Set up pnpm for DSH CLI
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Download all natively accepted micro-judge targets
        uses: actions/download-artifact@v8
        with:
          pattern: micro-judge-*
          path: ${{ runner.temp }}/micro-judge-input
      - name: Assemble the multi-platform package bundle
        run: node scripts/merge-micro-judge-artifacts.mjs "${{ runner.temp }}/micro-judge-input"
      - name: Install dependencies
        run: npm ci
      - name: Install actual coding Lisp runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl bubblewrap
          # Dedicated CI runner: permit the user namespaces required by bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install DeepSeek Harness CLI
        run: |-
          npm ci --prefix tests/fixtures/dsh-runtime
          echo "$PWD/tests/fixtures/dsh-runtime/node_modules/.bin" >> "$GITHUB_PATH"
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache-dsh
      - name: Prepare pinned terminal UI for the existing consumer checks
        if: matrix.partition == 'consumers'
        run: npm install --prefix tests/fixtures/dsh-runtime --no-save --package-lock=false --ignore-scripts --legacy-peer-deps @askdkc/dsh-cli@0.14.11 @xterm/headless@6.0.0
      - name: Export DSH fixture version
        run: node -e "const p=require('./tests/fixtures/dsh-runtime/package.json'); console.log('KIOKUKO_EXPECTED_DSH_VERSION='+p.dependencies['@deepseek-ai/dsh'])" >> "$GITHUB_ENV"
      - name: Run repository verification (CI main partition)
        run: npm run verify -- --profile ci-main --partition "${{ matrix.partition }}" --output "${{ runner.temp }}/verification-verify"
      - name: Retain the tested multi-platform package for release review
        if: matrix.partition == 'consumers'
        uses: actions/upload-artifact@v7
        with:
          name: multi-platform-package-${{ github.sha }}
          path: ${{ runner.temp }}/verification-verify/*.tgz
          if-no-files-found: error
      - name: Retain verification plan, logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-ci-main-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/verification-verify/**
            !${{ runner.temp }}/verification-verify/npm-cache/**
          if-no-files-found: error
  # Preserve the existing required check: omitted main tests are owned by Lisp.
  # Semantic platform failures must also fail this required aggregate.
  verify:
    needs: [verify-main, lisp-runtime, semantic-platform-smoke, micro-judge-native, shortcut-browser, dsh-runtime-macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - uses: actions/download-artifact@v8
        with:
          pattern: micro-judge-*
          path: ${{ runner.temp }}/micro-judge-input
      - run: node scripts/merge-micro-judge-artifacts.mjs "${{ runner.temp }}/micro-judge-input"
      - uses: actions/download-artifact@v8
        with:
          pattern: verification-ci-*
          path: ${{ runner.temp }}/ci-evidence
      - name: Require every job and current partition evidence
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/verify-ci-results.mjs "${{ runner.temp }}/ci-evidence"
  dsh-runtime-macos:
    needs: micro-judge-native
    name: DSH runtime smoke (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    env: {}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - name: Set up pnpm for DSH CLI
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Download all natively accepted micro-judge targets
        uses: actions/download-artifact@v8
        with:
          pattern: micro-judge-*
          path: ${{ runner.temp }}/micro-judge-input
      - name: Assemble the multi-platform package bundle
        run: node scripts/merge-micro-judge-artifacts.mjs "${{ runner.temp }}/micro-judge-input"
      - name: Install dependencies
        run: npm ci
      - name: Install actual coding Lisp runtime
        run: brew install sbcl
      - name: Install DeepSeek Harness CLI
        run: |-
          npm ci --prefix tests/fixtures/dsh-runtime
          echo "$PWD/tests/fixtures/dsh-runtime/node_modules/.bin" >> "$GITHUB_PATH"
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache-dsh
      - name: Prepare pinned terminal UI for the existing consumer checks
        run: npm install --prefix tests/fixtures/dsh-runtime --no-save --package-lock=false --ignore-scripts --legacy-peer-deps @askdkc/dsh-cli@0.14.11 @xterm/headless@6.0.0
      - name: Export DSH fixture version
        run: node -e "const p=require('./tests/fixtures/dsh-runtime/package.json'); console.log('KIOKUKO_EXPECTED_DSH_VERSION='+p.dependencies['@deepseek-ai/dsh'])" >> "$GITHUB_ENV"
      - name: Run repository verification (runtime)
        run: npm run verify -- --profile runtime --output "${{ runner.temp }}/verification-dsh-runtime-macos"
      - name: Retain verification plan, logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-ci-runtime-macos
          path: ${{ runner.temp }}/verification-dsh-runtime-macos
          if-no-files-found: error
  shortcut-browser:
    needs: micro-judge-native
    name: Keyboard UI (${{ matrix.fixture }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - dsh-runtime
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - name: Download all natively accepted micro-judge targets
        uses: actions/download-artifact@v8
        with:
          pattern: micro-judge-*
          path: ${{ runner.temp }}/micro-judge-input
      - name: Assemble the multi-platform package bundle
        run: node scripts/merge-micro-judge-artifacts.mjs "${{ runner.temp }}/micro-judge-input"
      - run: npm ci
      - run: npm ci --prefix tests/fixtures/${{ matrix.fixture }}
      - run: npx playwright install --with-deps chromium
      - name: Install protected Lisp runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run repository verification (browser)
        run: npm run verify -- --profile browser --output "${{ runner.temp }}/verification-shortcut-browser"
      - name: Retain verification plan, logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-shortcut-browser-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verification-shortcut-browser
          if-no-files-found: error
  semantic-platform-smoke:
    needs: micro-judge-native
    name: Semantic smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - name: Download all natively accepted micro-judge targets
        uses: actions/download-artifact@v8
        with:
          pattern: micro-judge-*
          path: ${{ runner.temp }}/micro-judge-input
      - name: Assemble the multi-platform package bundle
        run: node scripts/merge-micro-judge-artifacts.mjs "${{ runner.temp }}/micro-judge-input"
      - name: Install dependencies
        run: npm ci
      - name: Run repository verification (semantic)
        run: npm run verify -- --profile semantic --output "${{ runner.temp }}/verification-semantic-platform-smoke"
      - name: Retain verification plan, logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-semantic-platform-smoke-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verification-semantic-platform-smoke
          if-no-files-found: error
