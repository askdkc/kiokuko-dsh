name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Set up pnpm for DSH CLI
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: npm ci

      - name: Install pinned DeepSeek Harness CLI
        run: |
          dsh_cli_dir="$RUNNER_TEMP/dsh-cli"
          npm install --prefix "$dsh_cli_dir" --no-save @deepseek-ai/dsh@0.1.2-alpha.3
          echo "$dsh_cli_dir/node_modules/.bin" >> "$GITHUB_PATH"
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache-dsh

      - name: Type-check
        run: npm run typecheck

      - name: Run test suite
        run: npm test

      - name: Run semantic retrieval evaluation
        run: npm run test:evaluation

      - name: Verify sqlite-vec package and production composition
        run: npm run test:sqlite-vec
        env:
          KIOKUKO_REQUIRE_SQLITE_VEC_SMOKE: "1"

      - name: Verify sample database migration and Web API
        run: npm run test:sampledb

      - name: Verify package contents
        run: npm run pack:check

      - name: Verify reproducible prepare output
        run: npm run verify:prepare

      - name: Verify DeepSeek Harness composition and package lifecycle
        run: npm run test:e2e:dsh
        env:
          KIOKUKO_EXPECTED_DSH_VERSION: 0.1.2-alpha.3
          KIOKUKO_REQUIRE_DSH_CLI: "1"
          KIOKUKO_DSH_EVIDENCE_PATH: ${{ runner.temp }}/kiokuko-dsh-evidence.json

      - name: Upload DSH lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiokuko-dsh-evidence-linux
          path: ${{ runner.temp }}/kiokuko-dsh-evidence.json
          if-no-files-found: ignore

      - name: Verify pinned local embedding manifest
        run: node scripts/run-local-embedding-smoke.mjs --offline

  dsh-runtime-macos:
    name: DSH runtime smoke (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Set up pnpm for DSH CLI
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: npm ci

      - name: Install pinned DeepSeek Harness CLI
        run: |
          dsh_cli_dir="$RUNNER_TEMP/dsh-cli"
          npm install --prefix "$dsh_cli_dir" --no-save @deepseek-ai/dsh@0.1.2-alpha.3
          echo "$dsh_cli_dir/node_modules/.bin" >> "$GITHUB_PATH"
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache-dsh

      - name: Verify DeepSeek Harness Web lifecycle
        run: npm run test:e2e:dsh
        env:
          KIOKUKO_EXPECTED_DSH_VERSION: 0.1.2-alpha.3
          KIOKUKO_REQUIRE_DSH_CLI: "1"
          KIOKUKO_DSH_EVIDENCE_PATH: ${{ runner.temp }}/kiokuko-dsh-evidence.json

      - name: Upload DSH lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiokuko-dsh-evidence-macos
          path: ${{ runner.temp }}/kiokuko-dsh-evidence.json
          if-no-files-found: ignore

  semantic-platform-smoke:
    name: Semantic smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify sqlite-vec package and production composition
        run: npm run test:sqlite-vec
        env:
          KIOKUKO_REQUIRE_SQLITE_VEC_SMOKE: "1"

      - name: Verify pinned local embedding manifest
        run: node scripts/run-local-embedding-smoke.mjs --offline
