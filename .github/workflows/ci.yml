name: CI
on:
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
env:
  ONNXRUNTIME_NODE_INSTALL: skip
jobs:
  lisp-runtime:
    name: Protected Lisp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install test runtimes
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y sbcl bubblewrap python3 cargo
            # Dedicated CI runner: permit the user namespaces required by bwrap.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          else
            brew install sbcl python rust
          fi
      - run: npm ci
      - run: npm ci --prefix tests/fixtures/dsh-runtime
      - name: Export DSH fixture version
        run: node -e "const p=require('./tests/fixtures/dsh-runtime/package.json'); console.log('KIOKUKO_EXPECTED_DSH_VERSION='+p.dependencies['@deepseek-ai/dsh'])" >> "$GITHUB_ENV"
      - name: Run repository verification (lisp)
        run: npm run verify -- --profile lisp --output "${{ runner.temp }}/verification-lisp-runtime"
      - name: Retain verification plan, logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-lisp-runtime-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verification-lisp-runtime
          if-no-files-found: error
  verify-main:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: {}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - name: Set up pnpm for DSH CLI
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Install dependencies
        run: npm ci
      - name: Install actual coding Lisp runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl bubblewrap
          # Dedicated CI runner: permit the user namespaces required by bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install DeepSeek Harness CLI
        run: |-
          npm ci --prefix tests/fixtures/dsh-runtime
          echo "$PWD/tests/fixtures/dsh-runtime/node_modules/.bin" >> "$GITHUB_PATH"
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache-dsh
      - name: Export DSH fixture version
        run: node -e "const p=require('./tests/fixtures/dsh-runtime/package.json'); console.log('KIOKUKO_EXPECTED_DSH_VERSION='+p.dependencies['@deepseek-ai/dsh'])" >> "$GITHUB_ENV"
      - name: Run repository verification (CI main partition)
        run: npm run verify -- --profile ci-main --output "${{ runner.temp }}/verification-verify"
      - name: Retain verification plan, logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-verify-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verification-verify
          if-no-files-found: error
  # Preserve the existing required check: omitted main tests are owned by Lisp.
  verify:
    needs: [verify-main, lisp-runtime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main and every protected runtime result
        env:
          MAIN_RESULT: ${{ needs.verify-main.result }}
          LISP_RESULT: ${{ needs.lisp-runtime.result }}
        run: test "$MAIN_RESULT" = success && test "$LISP_RESULT" = success
  dsh-runtime-macos:
    name: DSH runtime smoke (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    env: {}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - name: Set up pnpm for DSH CLI
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Install dependencies
        run: npm ci
      - name: Install actual coding Lisp runtime
        run: brew install sbcl
      - name: Install DeepSeek Harness CLI
        run: |-
          npm ci --prefix tests/fixtures/dsh-runtime
          echo "$PWD/tests/fixtures/dsh-runtime/node_modules/.bin" >> "$GITHUB_PATH"
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache-dsh
      - name: Export DSH fixture version
        run: node -e "const p=require('./tests/fixtures/dsh-runtime/package.json'); console.log('KIOKUKO_EXPECTED_DSH_VERSION='+p.dependencies['@deepseek-ai/dsh'])" >> "$GITHUB_ENV"
      - name: Run repository verification (runtime)
        run: npm run verify -- --profile runtime --output "${{ runner.temp }}/verification-dsh-runtime-macos"
      - name: Retain verification plan, logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-dsh-runtime-macos-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verification-dsh-runtime-macos
          if-no-files-found: error
  shortcut-browser:
    name: Keyboard UI (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - dsh-runtime
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - run: npm ci
      - run: npm ci --prefix tests/fixtures/${{ matrix.fixture }}
      - run: npx playwright install --with-deps chromium
      - name: Install protected Lisp runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run repository verification (browser)
        run: npm run verify -- --profile browser --output "${{ runner.temp }}/verification-shortcut-browser"
      - name: Retain verification plan, logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-shortcut-browser-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verification-shortcut-browser
          if-no-files-found: error
  semantic-platform-smoke:
    name: Semantic smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository verification (semantic)
        run: npm run verify -- --profile semantic --output "${{ runner.temp }}/verification-semantic-platform-smoke"
      - name: Retain verification plan, logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-semantic-platform-smoke-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verification-semantic-platform-smoke
          if-no-files-found: error
