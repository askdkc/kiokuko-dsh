name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # CPU binaries are bundled. Avoid the unpatched adm-zip extraction path
  # used by ONNX Runtime's optional accelerator download installer.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  lisp-runtime:
    name: Protected Lisp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install test runtimes
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y sbcl bubblewrap python3 cargo
            # Dedicated CI runner: permit the user namespaces required by bwrap.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          else
            brew install sbcl python rust
          fi
      - run: npm ci
      - run: npm ci --prefix tests/fixtures/dsh-runtime
      - name: Export DSH fixture version
        run: node -e "const p=require('./tests/fixtures/dsh-runtime/package.json'); console.log('KIOKUKO_EXPECTED_DSH_VERSION='+p.dependencies['@deepseek-ai/dsh'])" >> "$GITHUB_ENV"
      - name: Verify native search against DSH
        run: node scripts/run-tests.mjs tests/dsh/integration/native-search.test.ts
        env:
          KIOKUKO_DSH_PACKAGE_ROOT: ${{ github.workspace }}/tests/fixtures/dsh-runtime/node_modules
          KIOKUKO_REQUIRE_DSH_NATIVE: "1"
      - name: Verify Laya worker protocol and input integrity without Core ML
        run: npm run test:laya-worker
      - run: npm run verify:lisp:vendor
      - name: Test actual runtime and native DSH guard
        shell: bash
        run: |
          KIOKUKO_REQUIRE_LISP_RUNTIME=1 \
          KIOKUKO_DSH_PACKAGE_ROOT="$PWD/tests/fixtures/dsh-runtime/node_modules" \
          npm run test:lisp
      - name: Verify owned Node and Cargo receipts
        shell: bash
        run: |
          KIOKUKO_REQUIRE_DSH_NATIVE=1 \
          KIOKUKO_REQUIRE_CARGO_RUNTIME=1 \
          KIOKUKO_DSH_PACKAGE_ROOT="$PWD/tests/fixtures/dsh-runtime/node_modules" \
          node scripts/run-tests.mjs tests/dsh/integration/owned-execution.test.ts tests/dsh/integration/owned-native-lifecycle.test.ts
      - run: npm run pack:check
      - name: Verify Skill bodies through native and packed model delivery
        run: npm run test:skill-delivery
      - name: Verify isolated core and optional module packages
        run: npm run test:modules

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIOKUKO_REQUIRE_DSH_NATIVE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Set up pnpm for DSH CLI
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Install dependencies
        run: npm ci

      - name: Install DeepSeek Harness CLI
        run: |
          dsh_cli_dir="$RUNNER_TEMP/dsh-cli"
          mkdir -p "$dsh_cli_dir"
          cp tests/fixtures/dsh-runtime/package*.json "$dsh_cli_dir/"
          npm ci --prefix "$dsh_cli_dir"
          echo "$dsh_cli_dir/node_modules/.bin" >> "$GITHUB_PATH"
          echo "KIOKUKO_DSH_PACKAGE_ROOT=$dsh_cli_dir/node_modules" >> "$GITHUB_ENV"
          # The mandatory compaction suite loads the same native fixture.
          ln -s "$dsh_cli_dir/node_modules" tests/fixtures/dsh-runtime/node_modules
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache-dsh

      - name: Export DSH fixture version
        run: node -e "const p=require('./tests/fixtures/dsh-runtime/package.json'); console.log('KIOKUKO_EXPECTED_DSH_VERSION='+p.dependencies['@deepseek-ai/dsh'])" >> "$GITHUB_ENV"

      - name: Type-check
        run: npm run typecheck
      - name: Check deterministic Skill compilation and fixed efficiency targets
        run: npm run test:skill-prompts && npm run test:skill-efficiency

      - name: Run test suite
        run: npm test
      - name: Check coding evaluation without model calls
        run: npm run test:skill-coding:offline
      - name: Verify index reasoning and native model delivery
        run: npm run test:index-reasoning
        env:
          KIOKUKO_REQUIRE_DSH_NATIVE: "1"
      - name: Evaluate fixed index reasoning delivery offline
        run: npm run test:evaluation:index-reasoning

      - name: Check fixed harness scenarios
        run: npm run test:harness
        env:
          KIOKUKO_HARNESS_REPORT: ${{ runner.temp }}/kiokuko-harness-report.json

      - name: Upload harness scenario report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiokuko-harness-report
          path: ${{ runner.temp }}/kiokuko-harness-report.json
          if-no-files-found: error

      - name: Run semantic retrieval evaluation
        run: npm run test:evaluation

      - name: Check typed decision Skill evaluation fixtures
        run: npm run test:evaluation:decisions
      - name: Check Answer Review evaluation pipeline offline
        run: npm run test:evaluation:answer-review
      - name: Check memory reuse Choice and Noul evaluation fixtures
        run: npm run test:evaluation:memory-reuse -- --mode=all

      - name: Verify sqlite-vec package and production composition
        run: npm run test:sqlite-vec
        env:
          KIOKUKO_REQUIRE_SQLITE_VEC_SMOKE: "1"

      - name: Verify sample database baseline init and DSH resume
        run: npm run test:sampledb

      - name: Verify package contents
        run: npm run pack:check
        env:
          KIOKUKO_REQUIRE_DSH_NATIVE: "1"

      - name: Lint package publication metadata
        run: npm run publint

      - name: Verify reproducible prepare output
        run: npm run verify:prepare

      - name: Verify automatic AgenticReplay dependencies in an empty consumer
        run: npm run test:agenticreplay:package

      - name: Verify DeepSeek Harness composition and package lifecycle
        run: npm run test:e2e:dsh
        env:
          KIOKUKO_REQUIRE_DSH_CLI: "1"
          KIOKUKO_DSH_EVIDENCE_PATH: ${{ runner.temp }}/kiokuko-dsh-evidence.json

      - name: Upload DSH lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiokuko-dsh-evidence-linux
          path: ${{ runner.temp }}/kiokuko-dsh-evidence.json
          if-no-files-found: ignore

      - name: Verify pinned local embedding manifest
        run: node scripts/run-local-embedding-smoke.mjs --offline

  dsh-runtime-macos:
    name: DSH runtime smoke (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Set up pnpm for DSH CLI
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Install dependencies
        run: npm ci

      - name: Install DeepSeek Harness CLI
        run: |
          dsh_cli_dir="$RUNNER_TEMP/dsh-cli"
          mkdir -p "$dsh_cli_dir"
          cp tests/fixtures/dsh-runtime/package*.json "$dsh_cli_dir/"
          npm ci --prefix "$dsh_cli_dir"
          echo "$dsh_cli_dir/node_modules/.bin" >> "$GITHUB_PATH"
          echo "KIOKUKO_DSH_PACKAGE_ROOT=$dsh_cli_dir/node_modules" >> "$GITHUB_ENV"
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache-dsh

      - name: Export DSH fixture version
        run: node -e "const p=require('./tests/fixtures/dsh-runtime/package.json'); console.log('KIOKUKO_EXPECTED_DSH_VERSION='+p.dependencies['@deepseek-ai/dsh'])" >> "$GITHUB_ENV"

      - name: Verify native search against DSH
        run: node scripts/run-tests.mjs tests/dsh/integration/native-search.test.ts
        env:
          KIOKUKO_REQUIRE_DSH_NATIVE: "1"

      - name: Verify automatic AgenticReplay dependencies in an empty consumer
        run: npm run test:agenticreplay:package

      - name: Verify DeepSeek Harness Web lifecycle
        run: npm run test:e2e:dsh
        env:
          KIOKUKO_REQUIRE_DSH_CLI: "1"
          KIOKUKO_DSH_EVIDENCE_PATH: ${{ runner.temp }}/kiokuko-dsh-evidence.json

      - name: Upload DSH lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiokuko-dsh-evidence-macos
          path: ${{ runner.temp }}/kiokuko-dsh-evidence.json
          if-no-files-found: ignore

  shortcut-browser:
    name: Keyboard UI (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fixture: [dsh-runtime]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - run: npm ci
      - run: npm ci --prefix tests/fixtures/${{ matrix.fixture }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:models:web
      - run: npm run test:shortcuts:web
        env:
          KIOKUKO_SHORTCUT_RUNTIME: ${{ matrix.fixture }}
      - name: Install protected Lisp runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm run test:lisp:approval:web
        env:
          KIOKUKO_LISP_APPROVAL_RUNTIME: ${{ matrix.fixture }}

  semantic-platform-smoke:
    name: Semantic smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify sqlite-vec package and production composition
        run: npm run test:sqlite-vec
        env:
          KIOKUKO_REQUIRE_SQLITE_VEC_SMOKE: "1"

      - name: Verify pinned local embedding manifest
        run: node scripts/run-local-embedding-smoke.mjs --offline
