# DSH rejects changing the name of an existing row. Disable the stock export
# host and insert Kiokuko under its own stable id; removing this bundle restores
# the stock row automatically.
- id: session-log-download
  disabled: true
- insert:
    - id: kiokuko-dsh
      name: 'kiokuko-dsh'
      inject: [skills, systemPrompt, tools, commands, userQuestions, sessions, sessionQuery, sessionPersistence, llm, agents, attachments, connection, subagents]
      config:
        enabled: true
        orca:
          enabled: true
          storage: project
          capture:
            content: redacted
            reasoning: false
