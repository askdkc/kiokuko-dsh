# Kiokuko's DeepSeek Harness bundle layer. The host Loader owns lifecycle and
# the package entrypoint owns the Cordis effects.
- insert:
    - id: kiokuko-dsh
      name: 'kiokuko-dsh/dsh'
      inject: [skills, systemPrompt, tools, commands, userQuestions, sessions, agents]
      config:
        enabled: true
