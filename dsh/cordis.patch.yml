# DSH rejects changing the name of an existing row. Disable the stock export
# host and insert Kiokuko under its own stable id; removing this bundle restores
# the stock row automatically.
- id: session-log-download
  disabled: true
- insert:
    # Saved model providers must survive a failure of the execution plugin.
    - id: kiokuko-models
      name: 'kiokuko-dsh/models'
      inject: [llm, commands]
    - id: kiokuko-dsh
      name: 'kiokuko-dsh'
      inject: [skills, systemPrompt, tools, commands, userQuestions, sessions, sessionQuery, sessionPersistence, llm, agents, attachments, subagents, subprocess]
      config:
        enabled: true
        agenticReplay:
          enabled: true
          # Record each chat without asking; set true to be asked once per chat.
          askOnStart: false
          storage: project
          capture:
            content: redacted
            reasoning: false
